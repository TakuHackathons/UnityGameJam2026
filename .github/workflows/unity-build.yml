name: Unity Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux 64-bit
            os: ubuntu-latest
            target: StandaloneLinux64
            output: Builds/Linux64/unity-gamejam-2026.x86_64
            artifact: unity-gamejam-2026-linux-x64
            artifact-path: Builds/Linux64
          - name: Windows 64-bit
            os: windows-latest
            target: StandaloneWindows64
            output: Builds/Windows64/unity-gamejam-2026.exe
            artifact: unity-gamejam-2026-windows-x64
            artifact-path: Builds/Windows64
          - name: macOS
            os: macos-latest
            target: StandaloneOSX
            output: Builds/macOS/unity-gamejam-2026.app
            artifact: unity-gamejam-2026-macos
            artifact-path: Builds/macOS

          # Enable a platform by removing the leading "#" from every line in
          # one block below. Some platforms require additional project settings,
          # SDK credentials, signing certificates, or platform access from Unity.

          # - name: Windows 32-bit
          #   os: windows-latest
          #   target: StandaloneWindows
          #   output: Builds/Windows32/unity-gamejam-2026.exe
          #   artifact: unity-gamejam-2026-windows-x86
          #   artifact-path: Builds/Windows32

          - name: WebGL
            os: ubuntu-latest
            target: WebGL
            output: Builds/WebGL
            artifact: unity-gamejam-2026-webgl
            artifact-path: Builds/WebGL

          # - name: Android
          #   os: ubuntu-latest
          #   target: Android
          #   output: Builds/Android/unity-gamejam-2026.apk
          #   artifact: unity-gamejam-2026-android
          #   artifact-path: Builds/Android

          # - name: iOS Xcode project
          #   os: macos-latest
          #   target: iOS
          #   output: Builds/iOS
          #   artifact: unity-gamejam-2026-ios-xcode
          #   artifact-path: Builds/iOS

          # - name: tvOS Xcode project
          #   os: macos-latest
          #   target: tvOS
          #   output: Builds/tvOS
          #   artifact: unity-gamejam-2026-tvos-xcode
          #   artifact-path: Builds/tvOS

          # - name: visionOS Xcode project
          #   os: macos-latest
          #   target: VisionOS
          #   output: Builds/visionOS
          #   artifact: unity-gamejam-2026-visionos-xcode
          #   artifact-path: Builds/visionOS

          # - name: Universal Windows Platform
          #   os: windows-latest
          #   target: WSAPlayer
          #   output: Builds/UWP
          #   artifact: unity-gamejam-2026-uwp
          #   artifact-path: Builds/UWP

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Unity
        uses: RageAgainstThePixel/unity-setup@v3.0.3
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: ${{ matrix.target }}
          cache-installation: true

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v3.0.1
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build player
        shell: bash
        env:
          UNITY_BUILD_PATH: ${{ github.workspace }}/${{ matrix.output }}
        run: |
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget "${{ matrix.target }}" \
            -executeMethod UnityGameJam2026.CIBuild.Build \
            -logFile -

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
